name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write e exigido para a autenticacao via OIDC (sem chaves salvas).
permissions:
  id-token: write
  contents: read

jobs:
  lint-test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint (verificacao de sintaxe das funcoes)
        run: |
          for f in functions/*.js; do
            echo "verificando $f"
            node --check "$f"
          done

      - name: Testes (pipeline local, sem credenciais de nuvem)
        run: node local.js

      # Autentica via OIDC: o GitHub assina um token de identidade, a AWS
      # confere que ele veio deste repositorio e branch (definido na trust
      # policy da role) e devolve credenciais temporarias. Nenhuma chave de
      # acesso fica guardada em nenhum lugar.
      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::209308108483:role/github-actions-checkpoint3-deploy
          aws-region: eu-central-1

      - name: Build (empacotar cada funcao)
        run: |
          mkdir -p build
          for fn in validar salvar notificar trigger; do
            cp "functions/${fn}.js" index.js
            zip -j "build/${fn}.zip" index.js
            rm index.js
          done

      - name: Deploy (atualizar o codigo das 4 funcoes na AWS)
        run: |
          aws lambda update-function-code --function-name puc-checkpoint3-validar   --zip-file fileb://build/validar.zip   --output text
          aws lambda update-function-code --function-name puc-checkpoint3-salvar    --zip-file fileb://build/salvar.zip    --output text
          aws lambda update-function-code --function-name puc-checkpoint3-notificar --zip-file fileb://build/notificar.zip --output text
          aws lambda update-function-code --function-name puc-checkpoint3-trigger   --zip-file fileb://build/trigger.zip   --output text

      - name: Verificar deploy
        run: |
          for fn in puc-checkpoint3-validar puc-checkpoint3-salvar puc-checkpoint3-notificar puc-checkpoint3-trigger; do
            aws lambda wait function-updated-v2 --function-name "$fn"
            echo "$fn atualizada com sucesso"
          done
